/*
 * Unofficial Fabric port of Applied Energistics 2.
 * Applied Energistics 2 is (c) AlgorithmX2 and Team AppliedEnergistics, licensed LGPL-3.0 (code),
 * MIT (API) and CC BY-NC-SA 3.0 (assets). This build script is part of the port and is LGPL-3.0.
 *
 * Minecraft 26.x is not obfuscated, so this uses the non-remapping Loom plugin and no mappings.
 */
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'dev.emi' }
    }
    maven {
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'me.shedaniel.cloth'
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

// Upstream splits its code into src/main and src/client, but (like NeoForge's dev environment) compiles both
// against the full client jar: some src/main classes reference client classes. Both directories are therefore
// compiled into the single main source set; client code only runs from the client entrypoint.
loom {
    accessWidenerPath = file('src/main/resources/ae2.classtweaker')

    runs {
        configureEach {
            ideConfigGenerated = true
            property 'appeng.tests', 'true'
        }
        client {
            runDir = 'run'
        }
        server {
            runDir = 'run/server'
        }
        // Headless game tests (AE2's test plots), see NOTES.md
        gametest {
            server()
            name = 'Game Test'
            runDir = 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/report.xml"
        }
    }
}

// Modules that are not ported. Each exclusion is tracked in NOTES.md.
// Lines starting with '!' re-include files matched by an exclusion.
def excludedSourcesSpec = {
    def excluded = new org.gradle.api.tasks.util.PatternSet()
    def kept = new org.gradle.api.tasks.util.PatternSet()
    project.file('excluded-sources.txt').eachLine { line ->
        line = line.trim()
        if (line.startsWith('!')) {
            kept.include line.substring(1)
        } else if (!line.isEmpty() && !line.startsWith('#')) {
            excluded.include line
        }
    }
    def excludedSpec = excluded.asSpec
    def keptSpec = kept.asSpec
    def hasKept = !kept.includes.isEmpty()
    return { element ->
        !element.directory && excludedSpec.isSatisfiedBy(element) && !(hasKept && keptSpec.isSatisfiedBy(element))
    }
}()

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
            srcDir 'src/client/resources'
        }
        java {
            srcDir 'src/client/java'
            exclude excludedSourcesSpec
        }
    }
}

// Scripted client playtest (not part of the mod jar): ./gradlew runClientGameTest, see src/gametest
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'ae2-playtest'
        eula = true
        enableGameTests = false
        enableClientGameTests = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Optional integrations. Like upstream, the EMI API (only referenced by AE2's own API classes) is compiled
    // against the 1.21.1 NeoForge build, since EMI has no 26.x release.
    compileOnly "dev.emi:emi-neoforge:${project.emi_version}:api"
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}") { transitive = false }
    compileOnly "mezz.jei:jei-${project.jei_minecraft_version}-common-api:${project.jei_version}"
    compileOnly "mezz.jei:jei-${project.jei_minecraft_version}-fabric-api:${project.jei_version}"
    compileOnly("maven.modrinth:wthit:${project.wthit_version}") { transitive = false }
    compileOnly("maven.modrinth:jade:${project.jade_version}") { transitive = false }

    include(api("teamreborn:energy:${project.tr_energy_version}")) {
        exclude group: 'net.fabricmc.fabric-api'
        exclude group: 'net.fabricmc'
    }

    testImplementation(platform("org.junit:junit-bom:${project.junit_version}"))
    testImplementation(platform("org.assertj:assertj-bom:${project.assertj_version}"))
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'com.google.guava:guava-testlib:21.0'
    testImplementation "org.mockito:mockito-junit-jupiter:${project.mockito_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

processResources {
    def props = [version: project.version, minecraft_version: project.minecraft_version,
                 loader_version: project.loader_version, upstream_version: project.upstream_version]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs << '-Xmaxerrs' << '100000'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

jar {
    from('LICENSE') { rename { "LICENSE_ae2-fabricated" } }
    from('src/main/java/appeng/api/LICENSE') { rename { "LICENSE_ae2-api" } }
}

test {
    useJUnitPlatform()
}
