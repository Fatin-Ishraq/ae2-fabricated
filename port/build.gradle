plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
        content { includeGroup 'org.parchmentmc.data' }
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'dev.emi' }
    }
    maven {
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'me.shedaniel.cloth'
            includeGroup 'dev.architectury'
        }
    }
    maven {
        url = 'https://maven2.bai.lol'
        content {
            includeGroup 'mcp.mobius.waila'
            includeGroup 'lol.bai'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
        java {
            // Modules that are not ported yet. Each exclusion is tracked in NOTES.md.
            // Lines starting with '!' re-include files matched by an exclusion.
            def excluded = new org.gradle.api.tasks.util.PatternSet()
            def kept = new org.gradle.api.tasks.util.PatternSet()
            project.file('excluded-sources.txt').eachLine { line ->
                line = line.trim()
                if (line.startsWith('!')) {
                    kept.include line.substring(1)
                } else if (!line.isEmpty() && !line.startsWith('#')) {
                    excluded.include line
                }
            }
            def excludedSpec = excluded.asSpec
            def keptSpec = kept.asSpec
            def hasKept = !kept.includes.isEmpty()
            exclude { element ->
                !element.directory && excludedSpec.isSatisfiedBy(element) && !(hasKept && keptSpec.isSatisfiedBy(element))
            }
        }
    }
}

// Scripted client playtest (not part of the mod jar): ./gradlew runPlaytest, see src/playtest
sourceSets {
    playtest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    accessWidenerPath = file('src/main/resources/ae2.accesswidener')
    mods {
        ae2 {
            sourceSet sourceSets.main
        }
        'ae2-playtest' {
            sourceSet sourceSets.playtest
        }
    }
    runs {
        configureEach {
            ideConfigGenerated = true
            property 'appeng.tests', 'true'
        }
        client {
            runDir = 'run'
        }
        server {
            runDir = 'run/server'
        }
        playtest {
            client()
            name = 'AE2 Playtest'
            source sourceSets.playtest
            runDir = 'build/playtest'
            property 'ae2.playtest', 'true'
            // Run only some steps: ./gradlew runPlaytest -PplaytestSteps=area_overlay,terminal
            property 'ae2.playtest.steps', (project.findProperty('playtestSteps') ?: '').toString()
        }
        // Headless game tests (AE2's test plots), see NOTES.md
        gametest {
            server()
            name = 'Game Test'
            runDir = 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/report.xml"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft_version}:${project.parchment_version}@zip")
    }
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Recipe viewer APIs, needed by appeng.api.integrations (public API) and the integration modules
    modCompileOnly("dev.emi:emi-fabric:${project.emi_version}")
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}") {
        exclude group: 'net.fabricmc'
        exclude group: 'net.fabricmc.fabric-api'
    }
    modCompileOnly("mcp.mobius.waila:wthit-api:fabric-${project.wthit_version}") {
        exclude group: 'net.fabricmc'
        exclude group: 'net.fabricmc.fabric-api'
    }
    modCompileOnly("maven.modrinth:jade:${project.jade_version}")

    include(modApi("teamreborn:energy:${project.tr_energy_version}")) {
        exclude group: 'net.fabricmc.fabric-api'
    }

    testImplementation(platform("org.junit:junit-bom:${project.junit_version}"))
    testImplementation(platform("org.assertj:assertj-bom:${project.assertj_version}"))
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'com.google.guava:guava-testlib:21.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

processResources {
    def props = [version: project.version, minecraft_version: project.minecraft_version,
                 loader_version: project.loader_version, upstream_version: project.upstream_version]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs << '-Xmaxerrs' << '100000'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

jar {
    from('LICENSE') { rename { "LICENSE_ae2-fabricated" } }
    from('src/main/java/appeng/api/LICENSE') { rename { "LICENSE_ae2-api" } }
}

test {
    useJUnitPlatform()
}
